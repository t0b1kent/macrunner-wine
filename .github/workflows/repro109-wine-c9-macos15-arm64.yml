name: REPRO-109 Wine for c9 from pinned sources

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repro109-wine-c9-${{ github.ref }}
  cancel-in-progress: false

jobs:
  wine:
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - name: Checkout component recipe
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Select pinned driver Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.7'
          architecture: arm64
      - name: Select pinned Xcode 26.3
        shell: bash
        run: |
          set -euo pipefail
          selected=0
          for xcode_app in /Applications/Xcode*.app; do
            [ -d "$xcode_app/Contents/Developer" ] || continue
            actual=$(DEVELOPER_DIR="$xcode_app/Contents/Developer" xcodebuild -version)
            if [ "$actual" = $'Xcode 26.3\nBuild version 17C529' ]; then
              printf 'DEVELOPER_DIR=%s/Contents/Developer\n' "$xcode_app" >> "$GITHUB_ENV"
              selected=1
              break
            fi
          done
          [ "$selected" = 1 ] || { printf 'Pinned Xcode 26.3/17C529 missing\n'; exit 1; }
      - name: Check source recipe without downloads
        run: python3 -I -B build/repro109wine/build_full.py --check-inputs
      - name: Build all source dependencies and Wine
        shell: bash
        run: |
          set -uo pipefail
          python3 -I -B build/repro109wine/build_full.py --profile github-macos15-arm64 \
            --build --work "$RUNNER_TEMP/repro109-wine-c9-work" --jobs 3 \
            > "$RUNNER_TEMP/repro109-wine-c9-driver.log" 2>&1
          build_rc=$?
          printf '%s\n' "$build_rc" > "$RUNNER_TEMP/repro109-wine-c9-rc.txt"
          printf 'Full source Wine build rc=%s; function/section acceptance and stands pending\n' "$build_rc"
          exit "$build_rc"
      - name: Collect unsigned outputs and complete reports
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/repro109-wine-c9-work"
          out="$RUNNER_TEMP/repro109-wine-c9-results"
          mkdir -p "$out"
          for part in reports deps/reports moltenvk/reports wine/reports; do
            if [ -d "$work/$part" ]; then
              mkdir -p "$out/$part"
              cp -R "$work/$part/." "$out/$part/"
            fi
          done
          if [ -d "$work/wine/install" ]; then
            tar -czf "$out/wine-dist.tar.gz" -C "$work/wine/install" .
          fi
          if [ -d "$work/deps/prefix" ]; then
            tar -czf "$out/dependency-prefix.tar.gz" -C "$work/deps/prefix" .
          fi
          for archive in "$out"/*.tar.gz; do
            [ -f "$archive" ] || continue
            shasum -a 256 "$archive" > "$archive.sha256"
          done
      - name: Preserve reports and unsigned component outputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: repro109-wine-c9-${{ github.sha }}
          path: |
            ${{ runner.temp }}/repro109-wine-c9-results/
            ${{ runner.temp }}/repro109-wine-c9-driver.log
            ${{ runner.temp }}/repro109-wine-c9-rc.txt
          if-no-files-found: error
          retention-days: 7
