name: REPRO109 independent Wine source prerequisite stages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repro109-wine-c9-matrix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prerequisite:
    name: Source prerequisite ${{ matrix.stage }}
    runs-on: macos-15
    timeout-minutes: 110
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        stage: [sdk, deps10, moltenvk2, compiler]
    env:
      REPRO109_STAGE: ${{ matrix.stage }}
    steps:
      - name: Initialize slot evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/repro109-wine-slot"
          printf '%s\n' "$REPRO109_STAGE" > "$RUNNER_TEMP/repro109-wine-slot/selected.txt"
          printf 'NOT_REACHED\n' > "$RUNNER_TEMP/repro109-wine-slot/state.txt"
          printf 'NOT_ENABLED\n' > "$RUNNER_TEMP/repro109-wine-slot/rc.txt"
      - name: Checkout dispatched recipe
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Select pinned driver Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.7'
          architecture: arm64
      - name: Select pinned Xcode 26.3
        shell: bash
        run: |
          set -euo pipefail
          selected=0
          for xcode_app in /Applications/Xcode*.app; do
            [ -d "$xcode_app/Contents/Developer" ] || continue
            actual=$(DEVELOPER_DIR="$xcode_app/Contents/Developer" xcodebuild -version)
            if [ "$actual" = $'Xcode 26.3\nBuild version 17C529' ]; then
              printf 'DEVELOPER_DIR=%s/Contents/Developer\n' "$xcode_app" >> "$GITHUB_ENV"
              selected=1
              break
            fi
          done
          [ "$selected" = 1 ] || { printf 'Pinned Xcode 26.3/17C529 missing\n'; exit 1; }
      - name: Execute only the selected source prerequisite
        shell: bash
        run: |
          set -uo pipefail
          slot="$RUNNER_TEMP/repro109-wine-slot"
          case "$REPRO109_STAGE" in
            sdk|deps10|moltenvk2|compiler) ;;
            *) printf 'Invalid stage selector\n'; exit 2 ;;
          esac
          python3 -I -B build/repro109wine/matrix.py --stage "$REPRO109_STAGE" \
            --work "$slot/work" --jobs 3 > "$slot/driver.log" 2>&1
          build_rc=$?
          printf '%s\n' "$build_rc" > "$slot/rc.txt"
          printf 'EXECUTED\n' > "$slot/state.txt"
          printf 'Wine prerequisite %s rc=%s; install skipped; full logs in artifact\n' "$REPRO109_STAGE" "$build_rc"
          exit "$build_rc"
      - name: Preserve complete bounded source reports for every stage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: repro109-wine-stage-${{ matrix.stage }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/repro109-wine-slot/selected.txt
            ${{ runner.temp }}/repro109-wine-slot/state.txt
            ${{ runner.temp }}/repro109-wine-slot/rc.txt
            ${{ runner.temp }}/repro109-wine-slot/driver.log
            ${{ runner.temp }}/repro109-wine-slot/work/reports/
            ${{ runner.temp }}/repro109-wine-slot/work/deps/reports/
            ${{ runner.temp }}/repro109-wine-slot/work/moltenvk/reports/
          if-no-files-found: error
          retention-days: 7
